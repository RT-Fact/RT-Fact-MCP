repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: ruff-check-all
        name: ruff check (all files)
        entry: ruff check .
        language: system
        stages: [pre-push]
        pass_filenames: false
      - id: ruff-format-check
        name: ruff format check (all files)
        entry: ruff format --check .
        language: system
        stages: [pre-push]
        pass_filenames: false
      - id: pyright
        name: pyright type check
        entry: poetry run pyright
        language: system
        stages: [pre-push]
        pass_filenames: false
