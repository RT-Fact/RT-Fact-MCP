[project]
name = "mcp-server"
version = "0.1.0"
description = "검색 기능과 AI 모델을 사용해 팩트 검증 기능을 제공하는 MCP 서버"
authors = [
    {name = "SangJin983",email = "lazistar983@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "langgraph (>=1.0.5,<2.0.0)",
    "google-genai (>=1.56.0,<2.0.0)",
    "tavily-python (>=0.7.17,<0.8.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.9.1,<3.0.0)",
    "structlog (>=25.5.0,<26.0.0)"
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver"
version_provider = "poetry"
update_changelog_on_bump = true
major_version_zero = true

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.10,<0.15.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "commitizen (>=4.11.0,<5.0.0)"
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# 무시할 규칙 (필요시 추가)
ignore = []
extend-select = ["UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests", "src"]
python_files = ["*_spec.py"]
asyncio_mode = "auto"
